<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>SwingTrader</title>
    <style>
      :root { --bg: #f5f5f7; --fg: #1d1d1f; --err: #c9342c; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000; --fg: #f5f5f7; --err: #ff6961; } }
      :root[data-theme="dark"] { --bg: #000; --fg: #f5f5f7; --err: #ff6961; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      .shell { padding: 24px 16px; max-width: 720px; margin: 0 auto; }
      .error { color: var(--err); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
